<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Spike de performance — Palácio Mental</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0a12;
        --fg: #e9e7f0;
        --dim: #9a95ad;
        --linha: #2a2739;
        --ok: #6ee7a8;
        --alerta: #f5c05e;
        --ruim: #f08b7c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        max-width: 720px;
        margin-inline: auto;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p.sub {
        color: var(--dim);
        margin: 0 0 20px;
        font-size: 13px;
      }
      fieldset {
        border: 1px solid var(--linha);
        border-radius: 10px;
        padding: 12px;
        margin: 0 0 16px;
      }
      legend {
        color: var(--dim);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 0 6px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
      }
      label input[type='number'] {
        width: 84px;
      }
      input,
      button,
      textarea {
        font: inherit;
        color: inherit;
        background: #16142033;
        border: 1px solid var(--linha);
        border-radius: 8px;
        padding: 8px 10px;
      }
      button {
        background: #221f33;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .acoes {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .acoes button {
        flex: 1 1 auto;
        min-height: 46px;
      }
      #estado {
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--linha);
        border-radius: 10px;
        color: var(--dim);
        font-size: 13px;
        margin-bottom: 16px;
        overflow-wrap: anywhere;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 16px;
        font-variant-numeric: tabular-nums;
      }
      caption {
        text-align: left;
        color: var(--dim);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding-bottom: 6px;
      }
      th,
      td {
        text-align: left;
        padding: 7px 6px;
        border-bottom: 1px solid var(--linha);
        vertical-align: top;
      }
      td:last-child,
      th:last-child {
        text-align: right;
        white-space: nowrap;
      }
      .ok {
        color: var(--ok);
      }
      .alerta {
        color: var(--alerta);
      }
      .ruim {
        color: var(--ruim);
      }
      textarea {
        width: 100%;
        height: 180px;
        font-family: ui-monospace, monospace;
        font-size: 11px;
      }
      .oculto {
        display: none;
      }
      /* Em tela estreita a coluna de valores é `nowrap` e espremia o rótulo até
         uma palavra por linha. Empilhar é o único jeito de continuar legível. */
      @media (max-width: 560px) {
        tr {
          display: block;
          padding: 8px 0;
          border-bottom: 1px solid var(--linha);
        }
        th,
        td {
          display: block;
          padding: 0;
          border-bottom: none;
          text-align: left;
          white-space: normal;
        }
        th {
          color: var(--dim);
          font-weight: 500;
          font-size: 13px;
        }
        td,
        td:last-child {
          text-align: left;
          font-size: 17px;
          margin-top: 2px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Spike de performance</h1>
    <p class="sub">
      Mede os dois modelos quantizados num aparelho de verdade. Não faz parte do app — existe só
      para decidir se o reranker entra no produto.
    </p>

    <fieldset>
      <legend>Opções</legend>
      <label><input type="checkbox" id="comReranker" checked /> Medir o reranker</label>
      <label
        ><input type="checkbox" id="qualidade" checked /> Montar o grafo do seed com os
        modelos</label
      >
      <label
        >Textos no embedding <input type="number" id="repeticoes" value="12" min="1" max="60"
      /></label>
      <label
        >Pares no reranker <input type="number" id="pares" value="12" min="1" max="60"
      /></label>
      <label
        >Tamanho do palácio a projetar
        <input type="number" id="palacio" value="300" min="10" max="5000"
      /></label>
    </fieldset>

    <div class="acoes">
      <button id="rodar">Rodar</button>
      <button id="limpar">Limpar cache dos modelos</button>
    </div>

    <div id="estado">Pronto.</div>

    <div id="saida"></div>

    <div id="jsonBloco" class="oculto">
      <p class="sub">Selecione e copie para me mandar:</p>
      <textarea id="json" readonly></textarea>
    </div>

    <script type="module" src="/src/spike/main.ts"></script>
  </body>
</html>
