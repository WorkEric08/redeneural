<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- `user-scalable=no`: acabam o zoom por duplo toque e a pinça na página
         inteira, os dois jeitos de desenquadrar o app sem querer. A pinça da Rede
         é do canvas e continua.
         `interactive-widget=resizes-content`: o teclado encolhe a tela em vez de
         cobri-la, e o botão de salvar preso no pé sobe junto com ele — é o que a
         WebView do APK já faz sozinha. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- A porta é noite nos dois temas: até entrar, a barra do sistema também é
         (App.tsx tira a primeira meta ao passar por ela). Depois a barra segue a
         sala — Rich Black no escuro, Platinum no claro. -->
    <meta name="theme-color" content="#0d1b2a" id="cor-da-porta" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e5e7e6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1b2a" />
    <meta
      name="description"
      content="Seu palácio mental: conceitos viram neurônios dentro de livros e se conectam sozinhos por significado."
    />
    <title>Palácio Mental</title>
    <script>
      // CLAUDE.md §10: capturar o evento antes do bundle React carregar.
      window.__deferredInstallPrompt = null
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault()
        window.__deferredInstallPrompt = e
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
