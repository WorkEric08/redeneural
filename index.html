<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- `user-scalable=no`: acabam o zoom por duplo toque e a pinça na página
         inteira, os dois jeitos de desenquadrar o app sem querer. A pinça da Rede
         é do canvas e continua.
         `interactive-widget=resizes-content`: o teclado encolhe a tela em vez de
         cobri-la, e o botão de salvar preso no pé sobe junto com ele — é o que a
         WebView do APK já faz sozinha. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Preto fixo, sempre — não segue o tema (pedido do usuário, 17/09/2026). -->
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Seu palácio mental: conceitos viram neurônios dentro de livros e se conectam sozinhos por significado."
    />
    <title>Locus</title>
    <!-- As duas letras da primeira tela (o título gravado nas lombadas e o texto da fileira de
         baixo): a fonte só começa a baixar quando o CSS a descobre, e o texto trocaria de letra
         depois de já desenhado. O caminho é fixo porque `public/` não passa pelo hash do Vite. -->
    <link
      rel="preload"
      href="/fontes/source-sans-3-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fontes/source-sans-3-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // O tema escolhido, antes do CSS pintar (ver services/native/tema.ts). Só as duas versões
      // do Padrão ligam atributo; sem ele vale o clássico, como sempre foi.
      try {
        var tema = localStorage.getItem('locus-tema')
        if (tema === 'padrao-claro' || tema === 'padrao-escuro') {
          document.documentElement.dataset.tema = tema
        }
      } catch (e) {}
    </script>
    <script>
      // CLAUDE.md §10: capturar o evento antes do bundle React carregar.
      window.__deferredInstallPrompt = null
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault()
        window.__deferredInstallPrompt = e
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
